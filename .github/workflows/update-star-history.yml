name: Update Star History

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read current Star count
        id: repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          stars="$(curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY" | jq -r '.stargazers_count')"
          test "$stars" != "null"
          echo "stars=$stars" >> "$GITHUB_OUTPUT"

      - name: Update data and chart
        run: node scripts/update-star-history.mjs "${{ steps.repository.outputs.stars }}" .github/star-history.json assets/star-history.svg

      - name: Commit updated chart
        run: |
          if git diff --quiet -- .github/star-history.json assets/star-history.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/star-history.json assets/star-history.svg
          git commit -m "chore: update star history"
          git push
